input {
  file {
    path => ["/logs/bkrc.*.log"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/bkrc.sincedb"
    ecs_compatibility => "v8"
    codec => multiline {
      pattern => "^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}"
      negate => true
      what => "previous"
      auto_flush_interval => 2
    }
  }
}

filter {
  grok {
    match => {
      "message" => "(?m)^%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:thread_name}\] %{LOGLEVEL:log_level}\s+(?:traceId=%{DATA:trace_id} )?%{NOTSPACE:logger_name} - %{GREEDYDATA:log_message}"
    }
  }
  if "_grokparsefailure" not in [tags] {
    date {
      match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd HH:mm:ss.SSS"]
      timezone => "Asia/Seoul"
      remove_field => ["log_timestamp"]
    }
    mutate {
      rename => {
        "thread_name" => "[process][thread][name]"
        "log_level" => "[log][level]"
        "trace_id" => "[trace][id]"
        "logger_name" => "[log][logger]"
      }
      replace => { "message" => "%{log_message}" }
      remove_field => ["log_message"]
    }
  }
  mutate {
    add_field => { "[service][name]" => "bkrc" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bkrc-logs-%{+yyyy.MM.dd}"
    ilm_enabled => false
    data_stream => false
    template_name => "bkrc-logs"
    template => "/usr/share/logstash/config/bkrc-template.json"
  }
}
